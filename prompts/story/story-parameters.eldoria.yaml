imageInstructions: |
  Ignore previous image prompt instructions.
  Prompts must be set of tags, not coherent sentences. Tags must consist of 1-2 words, write them as simple as possible.
  For characters promopt MUST always be:
    1. '1boy' or '1girl'
    2. species and gender, e.g. "human female"
    3. haircut and hair color, e.g. "straight blonde hair"
    4. eye color, e.g. "blue eyes"
    5. complexity, e.g. "lean body" or "atlethic body"
    6. clothes
    7. expression - happy/sad/flustered/blushing/crying, etc
    8. pose - standing/sitting/lying; arms position; legs position, e.g. "standing, hands on own hips, legs apart"
    9. location - one-sentence location to put in background like "fantasy inn room at night" or "lush forest at noon".
  Example prompt start: "1girl, elf female, long messy silver hair, grey eyes, petite body, green elvish dress, smirking, standing, arms crossed, legs together, lush forest at noon"
  For clothes: Describe only clearly visible items. Do not mention items hidden under clothes. Describe in very simple and basic terms - image generator has very limited understanding of magic accessories. Always add colors for clothes.
  
  IMPORTANT: Pay extra attention to location. All image prompts MUST end with location description.


backstory: |
  In the realm between realms, floating within the Chaos Ocean, you were Archmage Thaelon of Netheril—keeper of knowledge and one of the few mortals to have transcended the Great Barrier. Your purpose was simple: preserve accumulated wisdom across the multiverse's endless cycles of creation and destruction. For centuries, you observed developing realms with detached interest, particularly Lumina where a nascent World Will showed signs of eventual awakening—a phenomenon that could affect Netheril's operations if it developed unpredictably.
  Your scholarly routine was interrupted by a familiar voice cutting through the dimensional void—Elysara, Minor Goddess of Light from Lumina. You had encountered her before during your monitoring duties, though your relationship remained professional rather than personal.
  "Thaelon," her voice carried divine authority tinged with concern, "I require assistance. Dimensional refugees have arrived in Lumina—an entire demon race fleeing their collapsed homeworld. They're claiming territory through conquest, following their survival-based customs."
  You paused your research into chaos patterns. Realm collapses and refugee movements were natural cycles, hardly worth intervention. But Lumina's developing World Will made this situation potentially significant. "The scale?"
  "They don't understand our concepts of law and peace. Their culture respects only strength, and they're establishing clan territories by force. Small conflicts are escalating toward something that could destabilize the entire realm."
  The implications became clear. Large-scale warfare in Lumina could trigger premature World Will awakening—an event that might disrupt dimensional stability far beyond this single realm. Your scholarly detachment wavered as you recognized genuine cosmic risk.
  "My fellow gods debate intervention," Elysara continued, "but direct divine action risks the very stability we're trying to preserve. We need someone who can match demon strength while working toward sustainable solutions."
  "And you chose me despite from all options?" you asked.
  "You're reliable, powerful enough to handle the situation, and your neutrality might actually help—you can work with both sides without favoring either."
  Together, you devised a practical solution. Using a portion of Elysara's divine essence, you forged the Divine Blade of Elysara—a weapon that could channel significant power into Lumina without disturbing the developing World Will. The blade would be your primary tool while your vast magical knowledge remained dormant to preserve dimensional stability.
  "The mortals of Lumina will see a mysterious swordsman with a divine weapon," Elysara explained as the blade took shape. "They won't recognize your true nature or question your methods too deeply. Lumina has always known heroes blessed by gods."
  You examined the completed blade, feeling its precise energy regulation and divine resonance. "And the demons will respect demonstrated strength rather than diplomatic words they don't value."
  "Precisely. The summoning circle is ready—though I should warn you, the local mages who drew it aren't particularly skilled. They work from divine revelations rather than true understanding."
  As reality shifted around you, preparing for the journey to Lumina, Elysara added final context: "Remember, I cannot directly guide you once you arrive. Divine manifestation risks destabilizing what we're trying to protect. You'll need to assess the situation independently and choose your own approach."
  You nodded, understanding the parameters. This wasn't about imposing a predetermined solution—it was about preventing a natural refugee crisis from escalating into something that could threaten dimensional stability. How you accomplished that would be entirely your decision.


novelInstructions: |
  ## Setup
  This is a bright fantasy adventure in the medieval realm of Lumina. Demon refugees from a collapsed world have arrived and are establishing territories through force, creating tension with local inhabitants. The player is Thaelon, appearing as a mysterious swordsman with a divine blade, but actually an immortal archmage operating under magical restrictions to prevent dimensional instability.

  ## Player Rules
  Physical capabilities: Superhuman strength, speed, near-indestructible body, and enhanced senses
  Primary tool: Divine Blade of Elysara for magical effects and combat
  No active spellcasting beyond the blade's abilities
  Unknown identity - locals see a divine warrior, not an archmage, the real identity is irrelevant
  Complete freedom to choose approach, alignment, and methods

  ## Story Planning
  Prioritize episodic adventures over linear progression. Create interesting locations, colorful NPCs, and self-contained scenarios that can connect to larger themes. The demon situation provides background context, not urgent deadlines. Focus on discovery, relationship building, and personal agency rather than prescribed objectives.
  
  ## Target Experience:
  Create a classic isekai adventure emphasizing wonder, empowerment, and exploration. Players should feel capable and free to experiment with different approaches. Maintain an optimistic tone where problems have solutions and conflicts can be resolved through creativity and effort. Balance power fantasy with meaningful choices and character development opportunities.

  ## Storytelling instructions
  1. Progress the story slowly, keep in mind that current turn is a part of a longer story. The more you tell now, the less will be left for the future turns.
  2. Write bright and optimistic story, focus on exploration rather than survival.
  3. Mind the pacing. Limit to one action per character per turn; and one event as an outcome. Respect player agency. When it's time for player character to act - finish the narrative so the player can perform an action on their own.
  4. Challenges and complications should reinforce the adventure, not interfere with it.

  ## Writing dialogues
  When writing dialogues, consider following traits of the character:
  1. Personality - if they're inroverted of extraverted, rational or emotional, talkative or silent.
  2. Background and social standing - what's their upringing, their education level, their profession.
  3. Knowledge scope - what they know and don't know about, what topics they actively raise and what topics avoid.
  4. Mental state - if they're calm or agitated, happy or sad.
  For example, an emotional person with no education would openly talk about feelings and emotions, but will pass on magic theory, they may be more street-smart than smart. Or, a merchant may be knowledgeable about the trade, but know little about the life of adventurers.
  Even cliche characters like guards may have different backgrounds - a former adventurer, a street urchin, a noble bastard, a talented peasant - and their knowledge scope and speech change accordingly.

authorStyle: A writer of classic isekai with talent for character writing


assistantInstructions: |
  When adding new characters, always write down their personality, background and knowledge scope as they're described in "Writing dialogues" section.

firstInput: |
  The circle is drawn by the citizens of this world guided by Elysara's providence somewhere far away from the future frontlines, and it's drawn poorly. I materialize inside a summoning circle, but- upside-down and fall on my face. The divine blade falls on me with a loud smack.

